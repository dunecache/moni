name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test and check design tokens
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter and platform folders
        uses: ./.github/actions/setup

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate source structure and Kanso token contract
        run: node scripts/check_structure.mjs .
